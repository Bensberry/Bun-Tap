# Project-wide Gradle settings.
# Specifies the JVM arguments used for the Gradle daemon process.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Enables the Gradle build cache.
org.gradle.caching=true
# Enables the Gradle configuration cache.
org.gradle.configuration-cache=true
# Use AndroidX libraries.
android.useAndroidX=true
# Kotlin code style for this project.
kotlin.code.style=official
# Each library's R class only contains its own resources.
android.nonTransitiveRClass=true

# Native ABIs packaged into the APK. OpenCV ships a large native library per ABI
# (arm64-v8a ~24 MB, armeabi-v7a ~16 MB, x86_64 ~59 MB uncompressed), so only the
# ABIs listed here are included. arm64-v8a covers nearly all modern phones,
# armeabi-v7a covers older 32-bit devices, and x86_64 covers the Android emulator.
# Example for a smaller phone-only APK:  buntap.abis=arm64-v8a
buntap.abis=arm64-v8a,armeabi-v7a,x86_64
